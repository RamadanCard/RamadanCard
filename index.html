<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اكتب اسمك</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- الصفحة الأولى: طلب الاسم -->
<section id="page1" class="page active">

  
  
    
  <!-- باقي الصفحة -->
  <p style="font-size:22px; text-align:center; margin-bottom:20px;">
    اكتب اسمك
  </p>

  <form id="nameForm" style="text-align:center;">
    <input type="text" placeholder="اسمك هنا" id="nameInput" required>
    <br><br>
    <button type="submit">متابعة</button>
  </form>

</section>


  <!-- الصفحة الثانية: الصورة + الاسم + زر حفظ -->
  <section id="page2" class="page">
    <div class="card" style="position:relative; display:inline-block;">
      <img src="images/ramadan.jpg" class="greeting-img">
      <div class="employee-name" id="employeeName"></div>
    </div>
    <br><br>
    <button id="saveBtn">حفظ الصورة</button>
    <canvas id="canvas" style="display:none;"></canvas>
  </section>

  <script src="script.js" defer></script>
</body>
</html>
